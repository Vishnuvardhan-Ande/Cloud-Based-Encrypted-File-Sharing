{% extends "base.html" %}
{% block content %}
<div style="max-width:380px;margin:4rem auto">
  <div class="card">
    <h1>Create account</h1>
    <form method="POST">
      <label style="font-size:.85rem;color:#555">Username</label><br>
      <input type="text" name="username" required autofocus>
      <label style="font-size:.85rem;color:#555">Password</label><br>
      <input type="password" name="password" required>
      <button type="submit" style="width:100%">Register</button>
    </form>
    <p style="margin-top:1rem;font-size:.85rem;color:#555;text-align:center">
      Have an account? <a class="link" href="/login">Log in</a>
    </p>
  </div>
</div>
{% endblock %}
