<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔐 SecureShare</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           background: #f5f5f5; color: #222; min-height: 100vh; }
    nav { background: #fff; border-bottom: 1px solid #e0e0e0; padding: 0 2rem;
          display: flex; align-items: center; justify-content: space-between; height: 56px; }
    nav .brand { font-weight: 700; font-size: 1.1rem; color: #222; text-decoration: none; }
    nav a { color: #555; text-decoration: none; margin-left: 1.5rem; font-size: 0.9rem; }
    nav a:hover { color: #000; }
    .container { max-width: 860px; margin: 2rem auto; padding: 0 1rem; }
    .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 10px;
            padding: 2rem; margin-bottom: 1.5rem; }
    h1 { font-size: 1.4rem; margin-bottom: 1.5rem; }
    h2 { font-size: 1.1rem; margin-bottom: 1rem; color: #333; }
    input[type=text], input[type=password], input[type=file] {
      width: 100%; padding: 0.6rem 0.8rem; border: 1px solid #ccc;
      border-radius: 6px; font-size: 0.95rem; margin-bottom: 1rem; }
    button, .btn { background: #222; color: #fff; border: none; padding: 0.6rem 1.4rem;
                   border-radius: 6px; cursor: pointer; font-size: 0.9rem;
                   text-decoration: none; display: inline-block; }
    button:hover, .btn:hover { background: #444; }
    .btn-sm { padding: 0.35rem 0.9rem; font-size: 0.82rem; }
    .btn-outline { background: #fff; color: #222; border: 1px solid #ccc; }
    .btn-outline:hover { background: #f0f0f0; }
    .alert { padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.9rem; }
    .alert-success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }
    .alert-error   { background: #fff1f2; border: 1px solid #fecdd3; color: #9f1239; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th { text-align: left; padding: 0.6rem 0.8rem; border-bottom: 2px solid #e0e0e0;
         color: #555; font-weight: 600; }
    td { padding: 0.6rem 0.8rem; border-bottom: 1px solid #f0f0f0; }
    tr:last-child td { border-bottom: none; }
    .empty { color: #999; font-size: 0.9rem; padding: 1rem 0; }
    a.link { color: #2563eb; text-decoration: none; }
    a.link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <nav>
    <a class="brand" href="/">🔐 SecureShare</a>
    <div>
      {% if session.username %}
        <span style="color:#555;font-size:0.9rem">{{ session.username }}</span>
        <a href="/logout">Logout</a>
      {% else %}
        <a href="/login">Login</a>
        <a href="/register">Register</a>
      {% endif %}
    </div>
  </nav>
  <div class="container">
    {% for cat, msg in get_flashed_messages(with_categories=true) %}
      <div class="alert alert-{{ cat }}">{{ msg }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
